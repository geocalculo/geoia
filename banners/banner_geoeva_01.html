<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Banner exportado</title>
<style>
:root{
  --primary:#19f0c2;
  --speed-pong:5s;
  --img-brightness:0.91;
  --img-contrast:1.36;
  --text-size:13px;
}
html,body{margin:0;padding:0;width:150px;height:600px;overflow:hidden;background:transparent;}
body{position:relative;width:150px;height:600px;overflow:hidden;}
#banner-link{display:block;width:150px;height:600px;position:relative;overflow:hidden;background:#000;text-decoration:none;border:0;}
#wrapper{width:100%;height:100%;position:relative;overflow:hidden;background:#000;}
.img-layer{
  position:absolute;
  width:220%;
  height:130%;
  left:0;
  top:0;
  object-fit:cover;
  filter:brightness(var(--img-brightness)) contrast(var(--img-contrast));
  animation:pong var(--speed-pong) linear infinite alternate;
  will-change:transform;
}
@keyframes pong{
  0%{
    transform:translate(var(--from-x,-20%),var(--from-y,-10%)) scale(1.04);
  }
  50%{
    transform:translate(
      calc((var(--from-x,-20%) + var(--to-x,-35%)) / 2),
      calc((var(--from-y,-10%) + var(--to-y,-15%)) / 2)
    ) scale(1.06);
  }
  100%{
    transform:translate(var(--to-x,-35%),var(--to-y,-15%)) scale(1.04);
  }
}
.info{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:34px 8px 26px;
  background:linear-gradient(transparent, rgba(0,0,0,.92));
  text-align:center;
  z-index:10;
  pointer-events:none;
}
.info-top{
  position:absolute;
  left:0;
  right:0;
  top:0;
  padding:10px 8px 18px;
  background:linear-gradient(rgba(0,0,0,.82),transparent);
  text-align:center;
  z-index:10;
  pointer-events:none;
}
.texto{
  color:var(--primary);
  font-size:var(--text-size);
  font-family:Inter,Arial,sans-serif;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.95px;
  line-height:1.15;
  text-shadow:0 2px 6px rgba(0,0,0,.95);
  word-break:break-word;
}
.titulo-banner{
  color:#fff;
  font-size:var(--text-size);
  font-family:Inter,Arial,sans-serif;
  font-weight:700;
  letter-spacing:.5px;
  line-height:1.2;
  text-shadow:0 1px 5px rgba(0,0,0,.9);
  word-break:break-word;
}
</style>
</head>

let idx = 0;
let subIdx = 0;
let motionIdx = 0;

const motionPresets = [
  { fromX: -20, fromY: -10, toX: -35, toY: -15 },
  { fromX: -35, fromY: -10, toX: -20, toY: -15 },
  { fromX: -35, fromY: -15, toX: -20, toY: -10 },
  { fromX: -20, fromY: -15, toX: -35, toY: -10 }
];

function getMotionPreset(){
  return motionPresets[motionIdx % motionPresets.length];
}

function rotar(){
  const s = slides[idx];
  if(!s || !s.imgs || !s.imgs.length) return;

  const src = s.imgs[subIdx];
  const motion = getMotionPreset();

  document.getElementById('wrapper').innerHTML =
    '<img src="' + src + '" class="img-layer" alt="banner" ' +
    'style="--from-x:' + motion.fromX + '%;--from-y:' + motion.fromY + '%;--to-x:' + motion.toX + '%;--to-y:' + motion.toY + '%;">';

  document.getElementById('capa-texto').innerText = s.t || '';

  motionIdx++;
  subIdx++;

  if(subIdx >= s.imgs.length){
    subIdx = 0;
    idx = (idx + 1) % slides.length;
  }
}

rotar();
setInterval(rotar, 6000);
</script>
