<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <title>GeoIPT - BBOX Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />





  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/bbox_test.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #020617;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    header {
      background: #020617;
      border-bottom: 1px solid #111827;
      padding: 10px 16px;
    }

    header h1 {
      font-size: 1.25rem;
      margin: 0;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    #map {
      height: 420px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    h2 {
      margin-top: 24px;
      margin-bottom: 8px;
      font-size: 1.1rem;
      color: #38bdf8;
    }

    p {
      margin: 4px 0;
      line-height: 1.4;
    }

    /* Tabla de metadata */
    #tabla-metadata {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: #0f172a;
      color: #e5e7eb;
      font-size: 0.9rem;
    }

    #tabla-metadata th {
      text-align: left;
      padding: 6px;
      border-bottom: 1px solid #1e293b;
      font-weight: 600;
    }

    #tabla-metadata td {
      padding: 6px;
      border-bottom: 1px solid #1e293b;
    }

    /* Enlace de descarga */
    #link-kml {
      color: #38bdf8;
      text-decoration: underline;
      font-size: 0.95rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    #link-kml:hover {
      color: #7dd3fc;
    }

    /* Mensaje KML */
    #msg-kml {
      margin-top: 10px;
      padding: 8px 12px;
      background: #0b1220;
      border: 1px solid #1e293b;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #94a3b8;
      display: none;
    }

    #msg-kml a {
      color: #60a5fa;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div id="loading-overlay" class="loading-overlay" aria-live="polite" aria-busy="true">
    <div class="loading-card">
      <div class="loading-ring-wrap">
        <div class="loading-ring"></div>
        <div id="loading-percent" class="loading-percent">0%</div>
      </div>
      <div id="loading-text" class="loading-text">Analizando zona...</div>
    </div>
  </div>

  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NXSX7XCP"
      height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div class="container">
    <header>
      <h1>Reporte GeoIPT - Reporte del punto consultado</h1>
    </header>

    <main>
      <!-- Mapa -->
      <div id="map"></div>

      <!-- Barra KML centrada (entre mapa y título) -->
      <div class="kml-bar">
        <button id="btn-kml" class="kml-btn" type="button" disabled>
          KML
        </button>
      </div>


      <!-- Metadata de la Zona -->
      <h2>Metadata de la Zona</h2>

      <table id="tabla-metadata">
        <tbody>
          <tr>
            <th>Campo</th>
            <th>Valor</th>
          </tr>
          <tr><td>REG</td><td id="md-reg">–</td></tr>
          <tr><td>COM</td><td id="md-com">–</td></tr>
          <tr><td>LOCALIDAD</td><td id="md-loc">–</td></tr>
          <tr><td>ZONA</td><td id="md-zona">–</td></tr>
          <tr><td>NOMBRE</td><td id="md-nombre">–</td></tr>
          <tr><td>UPERM</td><td id="md-uperm">–</td></tr>
          <tr><td>UPROH</td><td id="md-uproh">–</td></tr>
          <tr><td>Capa</td><td id="md-capa">–</td></tr>
          <tr><td>CUT</td><td id="md-cut">–</td></tr>
        </tbody>
      </table>

      <!-- Descarga KML (LIBRE) -->
      <p style="margin-top:10px;">
        <a id="link-kml" href="#" style="display:none;">
          ⬇️ Descargar KML de la zona consultada
        </a>
      </p>

      <!-- Mensaje informativo -->
      <p id="msg-kml">
        ✅ Descarga libre habilitada.
        <a href="index.html">Ir al mapa principal</a>
      </p>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Turf para punto-en-polígono -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <!-- toGeoJSON para convertir KML -> GeoJSON -->
    <script src="https://unpkg.com/@tmcw/togeojson@4.5.0/dist/togeojson.umd.js"></script>

  <script>
  function setLoadingProgress(percent, text) {
    const safePercent = Math.max(0, Math.min(100, Math.round(percent || 0)));
    const percentEl = document.getElementById("loading-percent");
    const textEl = document.getElementById("loading-text");

    if (percentEl) percentEl.textContent = safePercent + "%";
    if (textEl && text) textEl.textContent = text;
  }

  function hideLoadingOverlay() {
    const overlay = document.getElementById("loading-overlay");
    if (!overlay) return;
    overlay.classList.add("is-hidden");
  }

  document.addEventListener("DOMContentLoaded", function () {
    setLoadingProgress(8, "Preparando consulta...");
  });
</script>
    
    
    <!-- Lógica propia -->
    <script src="js/bbox_test.js"></script>

    <!-- Forzar KML libre (sin auth) -->
    <script>
      (function(){
        const linkKml = document.getElementById("link-kml");
        const msg = document.getElementById("msg-kml");

        // Nota:
        // bbox_test.js es quien debería poner el href real cuando el KML esté listo.
        // Aquí dejamos la UI preparada para modo libre.
        if (msg) msg.style.display = "block";

        // Si bbox_test.js ya setea el href, nos aseguramos de mostrar el link.
        // Si no lo setea, quedará oculto hasta que bbox_test.js lo configure.
        if (linkKml && linkKml.getAttribute("href") && linkKml.getAttribute("href") !== "#") {
          linkKml.style.display = "inline";
        }
      })();
    </script>
  </div>

  <footer style="
    text-align:center;
    padding:16px;
    margin-top:40px;
    color:#64748b;
    font-size:0.8rem;
    border-top:1px solid #1e293b;
  ">
    © GeoIPT — geocalculo.cl
  </footer>
</body>
</html>
