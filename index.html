<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>GeoIPT · Sitio en mantenimiento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b1120;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 1.5rem;
    }

    .card {
      background: #020617;
      border: 1px solid #1f2937;
      padding: 2rem 2.5rem;
      border-radius: 1.25rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      animation: fadeIn 1.2s ease-out;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 0.95rem;
      color: #9ca3af;
      margin-top: 0.5rem;
      line-height: 1.45;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>GeoIPT</h1>
    <p><strong>Sitio en mantenimiento</strong></p>
    <p>
      Estamos realizando mejoras y actualizaciones.<br>
      Por favor vuelve a intentarlo más tarde.
    </p>
  </div>
</body>
</html>
