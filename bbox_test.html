<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>GeoIPT - BBOX Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script async src="https://www.googletagmanager.com/gtag/js?id=AW-2594851442"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-XHNJ5PB7QP');
  gtag('config', 'AW-2594851442');
</script>


  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/bbox_test.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #020617;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    header {
      background: #020617;
      border-bottom: 1px solid #111827;
      padding: 10px 16px;
    }

    header h1 {
      font-size: 1.25rem;
      margin: 0;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    #map {
      height: 420px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    h2 {
      margin-top: 24px;
      margin-bottom: 8px;
      font-size: 1.1rem;
      color: #38bdf8;
    }

    p {
      margin: 4px 0;
      line-height: 1.4;
    }

    pre {
      margin: 0;
      padding: 12px 14px;
      border-radius: 8px;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #btn-reporte {
      padding: 10px 22px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: #ffffff;
      cursor: pointer;
      margin-top: 24px;
      opacity: 0.5;
    }

    #btn-reporte:disabled {
      cursor: default;
    }

    .btn-container {
      text-align: center;
    }

    /* Tabla de metadata */
    #tabla-metadata {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: #0f172a;
      color: #e5e7eb;
      font-size: 0.9rem;
    }

    #tabla-metadata th {
      text-align: left;
      padding: 6px;
      border-bottom: 1px solid #1e293b;
      font-weight: 600;
    }

    #tabla-metadata td {
      padding: 6px;
      border-bottom: 1px solid #1e293b;
    }

    /* Enlace de descarga */
    #link-kml {
      color: #38bdf8;
      text-decoration: underline;
      font-size: 0.95rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    #link-kml:hover {
      color: #7dd3fc;
    }

    /* Mensaje para usuarios sin login */
    #msg-login-required {
      margin-top: 10px;
      padding: 8px 12px;
      background: #fef3c7;
      border: 1px solid #fde68a;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #92400e;
      display: none;
    }

    #msg-login-required a {
      color: #2563eb;
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
  <header>
    <h1>Reporte GeoIPT - Reporte del punto consultado</h1>
  </header>

  <main>
    <!-- Mapa -->
    <div id="map"></div>

    <!-- Metadata de la Zona -->
    <h2>Metadata de la Zona</h2>

    <table id="tabla-metadata">
      <tbody>
        <tr>
          <th>Campo</th>
          <th>Valor</th>
        </tr>
        <tr><td>REG</td><td id="md-reg">–</td></tr>
        <tr><td>COM</td><td id="md-com">–</td></tr>
        <tr><td>LOCALIDAD</td><td id="md-loc">–</td></tr>
        <tr><td>ZONA</td><td id="md-zona">–</td></tr>
        <tr><td>NOMBRE</td><td id="md-nombre">–</td></tr>
        <tr><td>UPERM</td><td id="md-uperm">–</td></tr>
        <tr><td>UPROH</td><td id="md-uproh">–</td></tr>
        <tr><td>Capa</td><td id="md-capa">–</td></tr>
        <tr><td>CUT</td><td id="md-cut">–</td></tr>
      </tbody>
    </table>

    <!-- Enlace de descarga KML (protegido) -->
    <p style="margin-top:10px;">
      <a id="link-kml" href="#" style="display:none;">
        Descargar KML de la zona consultada
      </a>
    </p>

    <!-- Mensaje para usuarios sin login o sin verificar -->
    <p id="msg-login-required">
      🔒 <strong>Inicia sesión para descargar archivos KML.</strong>
      <a href="index.html">Ir al mapa principal</a>
    </p>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Turf para punto-en-polígono -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <!-- toGeoJSON para convertir KML -> GeoJSON -->
  <script src="https://unpkg.com/@tmcw/togeojson@4.5.0/dist/togeojson.umd.js"></script>

  <!-- Lógica propia -->
  <script src="js/bbox_test.js"></script>

  <!-- ✅ Control de autenticación para descarga KML -->
  <script type="module">
    import { onUserChanged } from "./js/auth.js";

    const linkKml = document.getElementById("link-kml");
    const msgLogin = document.getElementById("msg-login-required");

    // Estado inicial: link oculto, mensaje visible
    if (linkKml) linkKml.style.display = "none";
    if (msgLogin) msgLogin.style.display = "block";

    // Escuchar cambios de autenticación
    onUserChanged((user) => {
      if (!linkKml || !msgLogin) return;

      // ✅ VERIFICAR: Usuario autenticado Y email verificado
      if (user && user.emailVerified) {
        // Usuario con email verificado: permitir descarga
        linkKml.style.display = "inline";
        linkKml.style.opacity = "1";
        linkKml.style.pointerEvents = "auto";
        msgLogin.style.display = "none";
        
        console.log('✅ Descarga KML habilitada - Email verificado');
      } else if (user && !user.emailVerified) {
        // Usuario autenticado PERO sin verificar: bloquear descarga
        linkKml.style.display = "none";
        msgLogin.innerHTML = `
          🔒 <strong>Debes verificar tu correo para descargar archivos KML.</strong><br>
          <small>Revisa tu bandeja de entrada y verifica tu cuenta.</small>
        `;
        msgLogin.style.display = "block";
        
        console.log('⚠️ Descarga KML bloqueada - Email no verificado');
      } else {
        // Usuario NO autenticado: bloquear descarga
        linkKml.style.display = "none";
        linkKml.style.opacity = "0.5";
        linkKml.style.pointerEvents = "none";
        msgLogin.innerHTML = `
          🔒 <strong>Inicia sesión para descargar archivos KML.</strong>
          <a href="index.html">Ir al mapa principal</a>
        `;
        msgLogin.style.display = "block";
        
        console.log('❌ Descarga KML bloqueada - Sin autenticación');
      }
    });
  </script>

  </div>
  <footer style="
    text-align:center;
    padding:16px;
    margin-top:40px;
    color:#64748b;
    font-size:0.8rem;
    border-top:1px solid #1e293b;
  ">
    © GeoIPT — geocalculo.cl
  </footer>

</body>
</html>
